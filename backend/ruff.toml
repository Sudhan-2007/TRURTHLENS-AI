target-version = "py313"

[lint.flake8-bugbear]
# FastAPI idiom: callables in default arguments (Depends/Query/Path/...).
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Security",
    "fastapi.Cookie",
]
