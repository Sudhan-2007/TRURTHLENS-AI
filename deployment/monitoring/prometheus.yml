global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: truthlens
    metrics_path: /api/metrics
    static_configs:
      - targets: ["frontend:80"]
    scrape_interval: 30s
