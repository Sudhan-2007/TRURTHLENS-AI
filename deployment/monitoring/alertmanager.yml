# Alertmanager configuration for the TruthLens monitoring stack.
#
# Route all alerts to the `default` receiver. Replace the webhook URL with your
# destination (Slack/Mattermost/PagerDuty/email/own webhook). The container
# resolves host.docker.internal to the Docker host, which is handy for local
# testing with a webhook catcher.
global:
  resolve_timeout: 5m

route:
  receiver: default
  group_by: ["alertname", "job"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: default
    webhook_configs:
      - url: "http://host.docker.internal:5000/alerts"
        send_resolved: true
