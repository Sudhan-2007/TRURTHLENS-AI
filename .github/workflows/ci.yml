name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install AI inference stack (CPU torch)
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r ai-engine/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend test suite
        working-directory: backend
        run: pytest -q
        env:
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DB: truthlens_test

      - name: Scan for committed secrets
        run: |
          if grep -rInE "(password|secret|api[_-]?key|token)[\"']?\s*[:=]\s*[\"'][^\"']{8,}" \
            --include="*.py" --include="*.js" --include="*.jsx" --include="*.json" --include="*.toml" \
            backend/app frontend/src .github 2>/dev/null; then
            echo "Possible secret committed to source."
            exit 1
          fi
          echo "No obvious secrets found."

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm run test

      - name: Production build
        working-directory: frontend
        run: npm run build

  deployment-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml (schema + interpolation)
        run: docker compose config --quiet

      - name: Validate compose against the example environment
        run: docker compose --env-file .env.example config --quiet

  docker-images:
    needs: [backend-tests, frontend-checks, deployment-checks]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
            ghcr.io/${{ github.repository }}/frontend:latest

  # Production deployment runs only on version tags AND only after every
  # quality gate above has passed (per the Phase 10 deployment rule).
  #
  # Required repository secrets (configure in the `production` environment):
  #   PROD_HOST, PROD_USER, PROD_SSH_PRIVATE_KEY, PROD_KNOWN_HOSTS,
  #   PROD_URL (public base URL for the smoke test), PROD_JWT_SECRET,
  #   PROD_DATABASE_URL, PROD_MONGODB_DB, PROD_CORS_ORIGINS,
  #   PROD_VITE_API_BASE_URL, GHCR_TOKEN (PAT with read:packages)
  deploy:
    needs: [backend-tests, frontend-checks, docker-images]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: production
    concurrency: production
    steps:
      - uses: actions/checkout@v4

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.PROD_KNOWN_HOSTS }}

      - name: Render production environment file
        run: |
          cat > .env <<'EOF'
          ENVIRONMENT=production
          DEBUG=false
          JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}
          DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}
          MONGODB_DB=${{ secrets.PROD_MONGODB_DB }}
          CORS_ORIGINS=${{ secrets.PROD_CORS_ORIGINS }}
          TRUTHLENS_MODEL_BACKEND=distilbert
          AI_MODEL_PATH=/app/ai-engine/models/distilbert
          VITE_API_BASE_URL=${{ secrets.PROD_VITE_API_BASE_URL }}
          HTTP_PORT=80
          BACKEND_IMAGE=ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          FRONTEND_IMAGE=ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          EOF
          docker compose config --quiet

      - name: Copy release files to production host
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,.env"
          target: /opt/truthlens

      - name: Deploy release on production host
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          script: |
            cd /opt/truthlens
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose ps

      - name: Smoke test production URL
        if: secrets.PROD_URL != ''
        run: python deployment/scripts/smoke_test.py --base "${{ secrets.PROD_URL }}"
